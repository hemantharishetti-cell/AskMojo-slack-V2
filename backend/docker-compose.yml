# ── AskMojo Backend — Production docker-compose ───────────────────────────────
# Compatible with: docker compose v2 (plugin) and docker-compose v1.29+
# Resource limits use the v2 top-level syntax (works WITHOUT Swarm mode).

services:
  askmojo-backend:
    build:
      context: .
      dockerfile: Dockerfile.prod
    image: askmojo-backend:prod
    container_name: askmojo_backend
    restart: always                   # auto-restart on crash AND server reboot

    ports:
      - "127.0.0.1:8004:8004"         # bind to loopback only — Nginx proxies externally

    # ── Secrets injected at runtime (NEVER baked into image) ─────────────────
    env_file:
      - .env

    # ── Per-container resource hard limits ────────────────────────────────────
    # mem_limit:     hard OOM kill threshold
    # memswap_limit: same as mem_limit → disables swap usage entirely
    # cpus:          soft CPU share (not a hard cap but prevents starvation)
    mem_limit: 2500m
    memswap_limit: 2500m              # = mem_limit disables swap
    cpus: "1.8"                       # leave 0.2 vCPU headroom for OS / Nginx

    # ── Log rotation — prevents disk exhaustion ───────────────────────────────
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # ── Persistent volumes ────────────────────────────────────────────────────
    # All data that must survive container restarts / image rebuilds
    volumes:
      - ./app/sqlite:/app/app/sqlite          # SQLite DB
      - ./app/uploads:/app/app/uploads        # Uploaded PDFs
      - chroma_data:/app/chromadb             # ChromaDB vector store
      - paddle_cache:/root/.paddleocr         # PaddleOCR model cache (avoids re-download)
      - hf_cache:/root/.cache/huggingface     # HuggingFace / Jina model cache

    # ── Extra runtime environment overrides ───────────────────────────────────
    environment:
      - PYTHONUNBUFFERED=1
      - ENVIRONMENT=production
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - TOKENIZERS_PARALLELISM=false
      - GLOG_minloglevel=3
      - HF_HUB_OFFLINE=1
      - TRANSFORMERS_OFFLINE=1
      - ASKMOJO_RERANKER_LOCAL_ONLY=1

    # ── Health check ──────────────────────────────────────────────────────────
    # start_period: 90s gives PaddleOCR + Jina reranker time to load
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8004/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

# ── Named volumes (managed by Docker, survive compose down) ──────────────────
volumes:
  chroma_data:
    driver: local
  paddle_cache:
    driver: local
  hf_cache:
    driver: local
