# ── AskMojo Nginx — Production Reverse Proxy Config ──────────────────────────
# Install: /etc/nginx/sites-available/askmojo
# Enable:  ln -s /etc/nginx/sites-available/askmojo /etc/nginx/sites-enabled/
# Test:    nginx -t
# Reload:  systemctl reload nginx

upstream askmojo_backend {
    server 127.0.0.1:8004;
    keepalive 16;              # reuse connections to backend — reduces TCP overhead
}

# ── Rate limiting zones ───────────────────────────────────────────────────────
# 10 req/s per IP for general API; 2 req/s for heavy upload endpoint
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_upload:10m  rate=2r/s;

server {
    listen 80;
    server_name _;                 # replace with your domain e.g. api.askmojo.io

    # ── Redirect HTTP → HTTPS (uncomment when SSL is configured) ─────────────
    # return 301 https://$host$request_uri;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"         always;
    add_header X-Frame-Options         "DENY"            always;
    add_header X-XSS-Protection        "1; mode=block"   always;
    add_header Referrer-Policy         "no-referrer"     always;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;
    gzip_min_length 1024;
    gzip_comp_level 4;           # level 4 = good ratio, low CPU cost
    gzip_vary on;

    # ── Request size limit (max PDF upload = 50 MB) ───────────────────────────
    client_max_body_size 50M;
    client_body_timeout  120s;   # allow slow uploads
    send_timeout         60s;

    # ── Connection tuning ─────────────────────────────────────────────────────
    keepalive_timeout    65s;
    keepalive_requests   100;

    # ── Health check — no rate limit, no logging ──────────────────────────────
    location = /api/health {
        access_log off;
        proxy_pass http://askmojo_backend;
        proxy_set_header Host $host;
    }

    # ── Upload endpoint — strict rate limit (CPU-heavy OCR) ──────────────────
    location ~ ^/api/v[12]/documents/upload {
        limit_req zone=api_upload burst=4 nodelay;
        limit_req_status 429;

        proxy_pass         http://askmojo_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection     "";
        proxy_set_header   Host           $host;
        proxy_set_header   X-Real-IP      $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout  300s;    # OCR on large PDFs can take ~3 min
        proxy_send_timeout  60s;
        proxy_connect_timeout 5s;
    }

    # ── All other API routes ──────────────────────────────────────────────────
    location / {
        limit_req zone=api_general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://askmojo_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection     "";   # enable keepalive to upstream
        proxy_set_header   Host           $host;
        proxy_set_header   X-Real-IP      $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_read_timeout  60s;
        proxy_send_timeout  30s;
        proxy_connect_timeout 5s;

        # Buffer responses — reduces backend socket hold time
        proxy_buffering    on;
        proxy_buffer_size  8k;
        proxy_buffers      8 16k;
    }
}

